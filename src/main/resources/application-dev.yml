spring:
  main:
    allow-bean-definition-overriding: true

  application:
    name: maispratiforum

  datasource:
    url: jdbc:${HOST}:${PORT}/${DATA_BASE}
    username: ${USER}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/google
        provider:
          google:
            token-uri: https://oauth2.googleapis.com/token
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

jwt:
  secret: ${SECRET_JWT}
  expiration: 3600000
  refreshExpiration: 86400000 # 24 horas em milissegundos

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  schemes: [http, https]  # Adiciona suporte a HTTP e HTTPS

# Configuração do nível de log
logging.level.root: INFO
logging.level.org.springframework.web: DEBUG
logging.level.com.maisprati.forum: DEBUG

# Definição do arquivo de log
logging.file.name: logs/application-dev.log